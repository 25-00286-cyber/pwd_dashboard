<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMEAS — AI Communication Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            background-image: radial-gradient(#fecaca 0.85px, transparent 0.85px);
            background-size: 20px 20px;
        }
        .font-mono-tech {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="text-slate-900 min-h-screen flex flex-col selection:bg-red-600 selection:text-white">

    <!-- Top App Header -->
    <header class="bg-red-700 text-white shadow-md sticky top-0 z-30 border-b border-red-800">
        <div class="max-w-xl mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-white text-red-700 p-2 rounded-xl shadow">
                    <i data-lucide="bot" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-sm sm:text-base font-black tracking-tight leading-tight">AI Communication Assistant</h1>
                    <p class="text-[11px] text-red-100 font-medium">SMEAS Non-Verbal PWD Support</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="audioToggleBtn" type="button" onclick="toggleAudio()"
                    class="text-[10px] font-mono-tech font-bold px-2.5 py-1 rounded-lg bg-red-800/80 text-white border border-red-400/40 cursor-pointer">
                    ALARM: ON
                </button>
                <span id="firebaseSyncPill" class="text-[10px] font-mono-tech font-bold px-2.5 py-1 rounded-lg bg-white text-red-700 shadow-sm">
                    SYNCING...
                </span>
            </div>
        </div>
    </header>

    <!-- Main Mobile App Container -->
    <main class="flex-grow max-w-xl w-full mx-auto px-4 py-5 space-y-4">

        <!-- Live Responder Acknowledgement Banner -->
        <div id="responderStatusBanner" class="bg-white rounded-2xl border-2 border-red-200 p-4 shadow-sm flex items-start gap-3 transition-all">
            <div class="p-2 rounded-xl bg-red-50 text-red-600 flex-shrink-0">
                <i data-lucide="radio" class="w-5 h-5"></i>
            </div>
            <div class="text-xs">
                <div id="statusBadgeText" class="font-extrabold text-red-700 uppercase tracking-wider text-[10px]">Ready • Connected to Admin Web</div>
                <div id="statusMainText" class="font-bold text-slate-900 text-sm mt-0.5">Tap any message below to alert a responder</div>
                <div id="statusSubText" class="text-slate-500 mt-0.5">Your message is sent live to the SMEAS Admin Dashboard.</div>
            </div>
        </div>

        <!-- Optional Sender Name / Location -->
        <div class="bg-white rounded-2xl border-2 border-red-100 p-4 shadow-sm space-y-1.5">
            <label for="senderNameInput" class="block text-xs font-extrabold text-slate-700">
                Your Name or Location Note (Optional):
            </label>
            <input type="text" id="senderNameInput" placeholder="e.g., Juan Dela Cruz — Ground Floor Ramp"
                class="w-full border border-red-200 bg-red-50/40 focus:bg-white rounded-xl px-3.5 py-2.5 text-sm font-semibold focus:outline-none focus:border-red-600 transition">
        </div>

        <!-- Category Selector -->
        <div class="bg-white rounded-2xl border-2 border-red-100 p-4 shadow-sm space-y-3">
            <div class="text-[11px] font-extrabold uppercase tracking-wider text-red-800">
1. Choose Assistance Category:
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="setAiContext('MOBILITY')" id="ctx-MOBILITY" class="ai-ctx-btn bg-red-600 text-white text-xs font-extrabold px-3 py-2.5 rounded-xl transition cursor-pointer">
                    Mobility &amp; Ramp
                </button>
                <button onclick="setAiContext('COMMUNICATION')" id="ctx-COMMUNICATION" class="ai-ctx-btn bg-white text-slate-700 border border-red-200 hover:bg-red-50 text-xs font-extrabold px-3 py-2.5 rounded-xl transition cursor-pointer">
                    Sign Language / Deaf
                </button>
                <button onclick="setAiContext('MEDICAL')" id="ctx-MEDICAL" class="ai-ctx-btn bg-white text-slate-700 border border-red-200 hover:bg-red-50 text-xs font-extrabold px-3 py-2.5 rounded-xl transition cursor-pointer">
                    Medical / Fatigue
                </button>
                <button onclick="setAiContext('NAVIGATION')" id="ctx-NAVIGATION" class="ai-ctx-btn bg-white text-slate-700 border border-red-200 hover:bg-red-50 text-xs font-extrabold px-3 py-2.5 rounded-xl transition cursor-pointer">
                    Facility Directions
                </button>
            </div>
        </div>

        <!-- Quick-Tap Phrases -->
        <div class="bg-white rounded-2xl border-2 border-red-100 p-4 shadow-sm space-y-3">
            <div class="text-[11px] font-extrabold uppercase tracking-wider text-red-800">
2. Tap a Message to Send to Admin:
            </div>
            <div id="aiPhraseGrid" class="grid grid-cols-1 gap-2.5"></div>
        </div>

        <!-- Custom Message Input -->
        <div class="bg-white rounded-2xl border-2 border-red-100 p-4 shadow-sm space-y-2">
            <label for="customAiMessage" class="block text-xs font-extrabold text-slate-700">
                Or Type a Custom Message (AI Auto-Suggests &amp; Sends):
            </label>
            <div class="flex gap-2">
                <input type="text" id="customAiMessage" placeholder="Type your message or describe what you need..."
                    oninput="handleSmartAiSuggest(this.value)"
                    onkeydown="if(event.key==='Enter') sendCustomAiMessage()"
                    class="flex-grow border border-red-200 rounded-xl px-3.5 py-2.5 text-sm font-medium focus:outline-none focus:border-red-600">
                <button onclick="sendCustomAiMessage()"
                    class="bg-red-600 hover:bg-red-700 active:scale-95 text-white font-extrabold text-xs px-4 py-2.5 rounded-xl flex items-center gap-1.5 transition cursor-pointer flex-shrink-0 shadow-md shadow-red-600/20">
                    <i data-lucide="send" class="w-4 h-4"></i>
                    <span>Send</span>
                </button>
            </div>
            <!-- Smart AI Suggestion Pill -->
            <div id="smartAiSuggestionBox" class="hidden pt-1.5">
                <button id="smartAiSuggestionBtn" type="button" onclick="applySmartAiSuggestion()"
                    class="w-full text-left bg-red-50 hover:bg-red-100 border border-red-300 rounded-xl px-3 py-2 text-xs font-bold text-red-900 flex items-center justify-between gap-2 transition cursor-pointer">
                    <span class="flex items-center gap-1.5">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-red-600 flex-shrink-0"></i>
                        <span id="smartAiSuggestionText"></span>
                    </span>
                    <span class="text-[10px] uppercase font-extrabold bg-red-600 text-white px-2 py-0.5 rounded-md flex-shrink-0">Tap to Send</span>
                </button>
            </div>
        </div>

    </main>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-4 left-4 right-4 z-50 flex flex-col items-center gap-2 pointer-events-none"></div>

    <script>
        lucide.createIcons();

        // Shared Firebase Realtime Database (same database as your main index.html)
        const FIREBASE_DB_URL = "https://smeas-batstateu-default-rtdb.firebaseio.com/";
        const AI_ALERTS_PATH = "alerts/active";

        let liveGpsLat = "";
        let liveGpsLng = "";
        let liveStationZone = "Mobile AI App";
        let activeEventId = null;
        let activeFirebaseKey = null;
        let activeMessageText = "";
        let isSendingAlert = false;
        let isSyncingPortal = false;
        let lastTapTimestamp = 0;
        let isAudioEnabled = true;
        let audioCtx = null;

        function initAudioContext() {
            if (!audioCtx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioCtx();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            const btn = document.getElementById('audioToggleBtn');
            if (isAudioEnabled) {
                initAudioContext();
                if (btn) btn.textContent = "ALARM: ON";
            } else {
                if (btn) btn.textContent = "ALARM: OFF";
            }
        }

        function playAlarmCue(cueType = 'ALERT') {
            if (!isAudioEnabled) return;
            try {
                initAudioContext();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = cueType === 'DISPATCH' ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(cueType === 'DISPATCH' ? 523.25 : 784.0, now);
                osc.frequency.linearRampToValueAtTime(cueType === 'DISPATCH' ? 659.25 : 987.77, now + 0.18);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            } catch (_) {}
        }

        // Capture phone browser GPS automatically if ESP32 NEO-6M hasn't locked yet
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    if (!liveGpsLat || !liveGpsLng) {
                        liveGpsLat = pos.coords.latitude.toFixed(6);
                        liveGpsLng = pos.coords.longitude.toFixed(6);
                    }
                },
                () => {},
                { enableHighAccuracy: true, maximumAge: 10000 }
            );
        }

        const aiContexts = {
            MOBILITY: [
                "I need assistance with a wheelchair ramp.",
                "Please help me navigate an obstacle ahead.",
                "I need seating or mobility support right away.",
                "Please escort me to the nearest elevator."
            ],
            COMMUNICATION: [
                "I am speech-impaired; please use text/screen.",
                "I need a sign language interpreter.",
                "Please write instructions on a notepad or phone.",
                "I need help communicating at the front desk."
            ],
            MEDICAL: [
                "I feel dizzy and need medical attention.",
                "Please bring a first-aid kit to my location.",
                "I need water and a quiet resting area.",
                "Urgent: Please contact the campus clinic."
            ],
            NAVIGATION: [
                "Where is the nearest accessible restroom?",
                "How do I reach the main exit ramp?",
                "Please guide me to the PWD priority lane.",
                "I am lost; please meet me at my location."
            ]
        };

        function setAiContext(ctxKey) {
            document.querySelectorAll('.ai-ctx-btn').forEach(btn => {
                btn.className = "ai-ctx-btn bg-white text-slate-700 border border-red-200 hover:bg-red-50 text-xs font-extrabold px-3 py-2.5 rounded-xl transition cursor-pointer";
            });
            const activeBtn = document.getElementById(`ctx-${ctxKey}`);
            if (activeBtn) {
                activeBtn.className = "ai-ctx-btn bg-red-600 text-white text-xs font-extrabold px-3 py-2.5 rounded-xl transition cursor-pointer shadow-sm";
            }

            const grid = document.getElementById('aiPhraseGrid');
            const phrases = aiContexts[ctxKey] || [];
            grid.innerHTML = phrases.map(phrase => {
                const isThisSent = Boolean(activeEventId) && activeMessageText === phrase;
                return `
                <button onclick="sendAiAlert('${phrase.replace(/'/g, "\\'")}')"
                    class="w-full text-left p-3.5 rounded-2xl border-2 ${isThisSent ? 'border-red-600 bg-red-50 text-red-900 shadow-sm' : 'border-red-200 hover:border-red-600 active:bg-red-600 active:text-white hover:bg-red-50 text-slate-800'} text-sm font-bold transition flex items-center justify-between gap-3 cursor-pointer">
                    <span>"${phrase}"</span>
                    <span class="inline-flex items-center gap-1 flex-shrink-0 text-[10px] uppercase font-extrabold text-red-600">
                        ${isThisSent ? 'Sent' : ''}
                        <i data-lucide="${isThisSent ? 'check-circle-2' : 'send'}" class="w-4 h-4 text-red-600"></i>
                    </span>
                </button>
                `;
            }).join('');
            lucide.createIcons();
        }

        function refreshActivePhraseStyles() {
            const activeCtxBtn = document.querySelector('.ai-ctx-btn.bg-red-600');
            const currentCtx = activeCtxBtn ? activeCtxBtn.id.replace('ctx-', '') : 'MOBILITY';
            setAiContext(currentCtx);
        }

        function sendCustomAiMessage() {
            const input = document.getElementById('customAiMessage');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            const sugBox = document.getElementById('smartAiSuggestionBox');
            if (sugBox) sugBox.classList.add('hidden');
            sendAiAlert(text);
        }

        let currentSmartSuggestion = "";

        function handleSmartAiSuggest(rawVal) {
            const q = (rawVal || "").trim().toLowerCase();
            const sugBox = document.getElementById('smartAiSuggestionBox');
            const sugText = document.getElementById('smartAiSuggestionText');
            if (!sugBox || !sugText) return;

            if (q.length < 2) {
                sugBox.classList.add('hidden');
                currentSmartSuggestion = "";
                return;
            }

            let suggestion = "";
            if (q.includes("cr") || q.includes("restroom") || q.includes("toilet") || q.includes("banyo")) {
                suggestion = "Where is the nearest accessible restroom? Please guide me.";
            } else if (q.includes("wheelchair") || q.includes("ramp") || q.includes("hagdan") || q.includes("stairs")) {
                suggestion = "I need wheelchair ramp or elevator assistance right away.";
            } else if (q.includes("deaf") || q.includes("sign") || q.includes("hear") || q.includes("speak") || q.includes("pipe")) {
                suggestion = "I am deaf/speech-impaired; please communicate via text or sign language.";
            } else if (q.includes("dizzy") || q.includes("hilo") || q.includes("pain") || q.includes("sick") || q.includes("clinic") || q.includes("med")) {
                suggestion = "Medical assistance needed: I feel unwell and need first-aid support.";
            } else if (q.includes("lost") || q.includes("where") || q.includes("saan") || q.includes("exit") || q.includes("gate")) {
                suggestion = "I am lost; please meet me at my current location to guide me.";
            } else if (q.includes("water") || q.includes("tubig") || q.includes("sit") || q.includes("upo") || q.includes("rest")) {
                suggestion = "I need drinking water and a priority seating area to rest.";
            }

            if (suggestion) {
                currentSmartSuggestion = suggestion;
                sugText.textContent = `AI Suggests: "${suggestion}"`;
                sugBox.classList.remove('hidden');
            } else {
                sugBox.classList.add('hidden');
                currentSmartSuggestion = "";
            }
        }

        function applySmartAiSuggestion() {
            if (!currentSmartSuggestion) return;
            const input = document.getElementById('customAiMessage');
            if (input) input.value = '';
            const sugBox = document.getElementById('smartAiSuggestionBox');
            if (sugBox) sugBox.classList.add('hidden');
            sendAiAlert(currentSmartSuggestion);
            currentSmartSuggestion = "";
        }

        function speakPhraseAloud(phrase) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(phrase);
                utter.rate = 0.95;
                window.speechSynthesis.speak(utter);
            }
        }

        async function sendAiAlert(messageText) {
            // 1-tap send with 800ms lockout so accidental double-taps never duplicate
            const nowMs = Date.now();
            if (nowMs - lastTapTimestamp < 800 || isSendingAlert) return;
            lastTapTimestamp = nowMs;

            isSendingAlert = true;
            try {
                const senderInput = (document.getElementById('senderNameInput')?.value || '').trim();
                const userName = senderInput !== '' ? senderInput : 'Mobile AI App User';
                const eventId = `#SMEAS-AI-${Math.floor(100 + Math.random() * 900)}`;

                // Single haptic tap + sound cue + voice readout (no continuous alarm or stop toggle)
                if (navigator.vibrate) navigator.vibrate([220, 90, 220]);
                playAlarmCue('ALERT');
                speakPhraseAloud(messageText);

                const banner = document.getElementById('responderStatusBanner');
                const badgeText = document.getElementById('statusBadgeText');
                const mainText = document.getElementById('statusMainText');
                const subText = document.getElementById('statusSubText');

                delete banner.dataset.dispatched;
                banner.className = "bg-red-50 rounded-2xl border-2 border-red-400 p-4 shadow-sm flex items-start gap-3 transition-all";
                badgeText.textContent = "Sending to Admin Dashboard...";
                mainText.textContent = `"${messageText}"`;
                subText.textContent = "Transmitting alert to responder queue...";

                // PUT to a single fixed Firebase node so it NEVER creates duplicate/spammed entries
                const res = await fetch(`${FIREBASE_DB_URL}${AI_ALERTS_PATH}.json`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        eventId: eventId,
                        userName: userName,
                        userProfile: "PWD Mobile AI Communication",
                        rawType: "AI_COMM",
                        type: "AI Communication",
                        payload: messageText,
                        zone: liveStationZone,
                        lat: String(liveGpsLat || ""),
                        lng: String(liveGpsLng || ""),
                        gpsFix: liveGpsLat && liveGpsLng ? "PHONE_GPS" : "ESP32_GPS",
                        source: "WEB_PWD",
                        status: "PENDING",
                        timestamp: Date.now()
                    })
                });
                if (res.ok) {
                    const firebaseResult = await res.json();
                    if (!firebaseResult || !firebaseResult.name) {
                        throw new Error("Firebase did not return an alert key.");
                    }
                    activeEventId = eventId;
                    activeFirebaseKey = firebaseResult.name;
                    activeMessageText = messageText;
                    refreshActivePhraseStyles();

                    banner.className = "bg-red-50 rounded-2xl border-2 border-red-600 p-4 shadow-sm flex items-start gap-3 transition-all";
                    badgeText.textContent = `Delivered to Admin Queue (${eventId})`;
                    mainText.textContent = `"${messageText}"`;
                    subText.textContent = "Received by SMEAS Admin Dashboard • Waiting for responder dispatch...";
                    showToast("Sent & Received by Admin", `"${messageText}"`);
                } else {
                    throw new Error(`HTTP ${res.status}`);
                }
            } catch (err) {
                showToast("Send Failed", "Could not reach Firebase. Check internet connection.");
            } finally {
                isSendingAlert = false;
            }
        }

        async function syncWithMainPortal() {
            if (isSyncingPortal) return;
            isSyncingPortal = true;
            const pill = document.getElementById('firebaseSyncPill');
            try {
                // 1. Read live ESP32 GPS telemetry if active so AI app messages inherit live coordinates
                const telRes = await fetch(`${FIREBASE_DB_URL}station/telemetry.json`);
                if (telRes.ok) {
                    if (pill) pill.textContent = "LIVE CONNECTED";
                    const tel = await telRes.json();
                    if (tel && typeof tel === "object") {
                        if (tel.stationId) liveStationZone = `${tel.stationId} (AI App)`;
                        if (tel.gpsFix === "3D_FIX" && tel.lat && tel.lng) {
                            liveGpsLat = String(tel.lat);
                            liveGpsLng = String(tel.lng);
                        }
                    }
                }

                // 2. Check if Admin dispatched or resolved our active message
                if (activeEventId && activeFirebaseKey) {
                    const alertRes = await fetch(`${FIREBASE_DB_URL}${AI_ALERTS_PATH}/${activeFirebaseKey}.json`);
                    if (alertRes.ok) {
                        const alertData = await alertRes.json();
                        const banner = document.getElementById('responderStatusBanner');
                        const badgeText = document.getElementById('statusBadgeText');
                        const mainText = document.getElementById('statusMainText');
                        const subText = document.getElementById('statusSubText');

                        if (!alertData || alertData.status === "RESOLVED") {
                            activeEventId = null;
                            activeFirebaseKey = null;
                            activeMessageText = "";
                            delete banner.dataset.dispatched;
                            refreshActivePhraseStyles();
                            banner.className = "bg-white rounded-2xl border-2 border-red-200 p-4 shadow-sm flex items-start gap-3 transition-all";
                            badgeText.textContent = "Request Completed";
                            mainText.textContent = "Responder resolved your request";
                            subText.textContent = "Tap any message below if you need more help.";
                        } else if (alertData.status === "DISPATCHED") {
                            if (banner.dataset.dispatched !== "1") {
                                banner.dataset.dispatched = "1";
                                if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
                                playAlarmCue('DISPATCH');
                            }
                            banner.className = "bg-white rounded-2xl border-2 border-red-600 p-4 shadow-md flex items-start gap-3 transition-all";
                            badgeText.textContent = "Responder On The Way";
                            mainText.textContent = "Help is en route to your location!";
                            subText.textContent = "A responder acknowledged your AI Communication request.";
                        }
                    }
                }
            } catch (_) {
                if (pill) pill.textContent = "OFFLINE";
            } finally {
                isSyncingPortal = false;
            }
        }

        function showToast(title, message) {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            while (container.children.length >= 1) {
                container.firstElementChild.remove();
            }

            const toast = document.createElement('div');
            toast.className = "pointer-events-auto max-w-sm w-full rounded-2xl p-3.5 shadow-xl border-2 bg-white text-slate-900 border-red-600 flex items-start gap-3 transition-all";
            toast.innerHTML = `
                <div class="p-1.5 rounded-xl bg-red-600 text-white flex-shrink-0">
                    <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                </div>
                <div class="text-xs">
                    <div class="font-extrabold">${title}</div>
                    <div class="text-slate-600 mt-0.5">${message}</div>
                </div>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        setAiContext('MOBILITY');
        syncWithMainPortal();
        setInterval(syncWithMainPortal, 1200);
    </script>
</body>
</html>
